version: '3.8'

services:
  scraper:
    build: .
    container_name: real-estate-scraper
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=scraper
      - DB_PASSWORD=scraper123
      - DB_NAME=real_estate
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - postgres
    networks:
      - scraper-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: scraper-postgres
    environment:
      - POSTGRES_USER=scraper
      - POSTGRES_PASSWORD=scraper123
      - POSTGRES_DB=real_estate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - scraper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: scraper-dashboard
    command: python dashboard.py
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=scraper
      - DB_PASSWORD=scraper123
      - DB_NAME=real_estate
    ports:
      - "8050:8050"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - postgres
    networks:
      - scraper-network
    restart: unless-stopped

  cli:
    build: .
    container_name: scraper-cli
    command: python -m src.cli --help
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=scraper
      - DB_PASSWORD=scraper123
      - DB_NAME=real_estate
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - postgres
    networks:
      - scraper-network
    profiles:
      - cli

volumes:
  postgres-data:

networks:
  scraper-network:
    driver: bridge
